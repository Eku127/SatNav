[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# The four VLM integrations own mutually incompatible environments and are
# tested explicitly from their README commands.  The repository-root suite is
# the core/applications/classic gate.
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
