# CMA Offline Trainer — ver_260317 预渲染轨迹数据
#
# This configuration implements the CMA model from "Improving Vision-and-Language
# Navigation with Image-Text Pairs from the Web" (Zhu et al., 2020).
# https://arxiv.org/abs/2004.02857
#
# Key differences from VLN-CE CMA:
#   - NO depth encoder (SatNav uses satellite imagery without depth)
#   - NO progress monitor (simplified implementation)
#   - Core CMA mechanism (RGB-instruction cross-modal attention) preserved
#
# 唯一默认训练路径：offline_trainer，不启动仿真器，直接读磁盘预渲染图片。
#
# class_weights 说明（20260326 诊断后修正）：
#   首轮训练 STOP=2.0 导致策略塌到"早停"（99.3% stopped_too_far，mean_steps=10.7）。
#   修正为 STOP=0.3，SR 从 0.27% 提升至 9.43%，mean_steps 从 10.7 升至 70.9。
#
# Usage:
#   单卡:  python run.py --exp-config configs/baselines/cma.yaml --run-type train
#   多卡:  bash scripts/cma/train_ddp.sh
#   评测:  python run.py --exp-config configs/baselines/cma.yaml --run-type eval \
#              EVAL.CKPT_PATH output/cma/checkpoints/latest/best.pth

_base_: configs/default.yaml

BASE_TASK_CONFIG_PATH: configs/satnav_task.yaml

TRAINER_NAME: offline_trainer

# ============================================================================
# DIRECTORIES
# ============================================================================
CHECKPOINT_FOLDER: output/cma/checkpoints/latest
RESULTS_DIR: output/cma/results/latest
VIDEO_DIR: output/cma/videos/latest

# ============================================================================
# VIDEO GENERATION
# ============================================================================
GENERATE_VIDEOS: false

# ============================================================================
# DATASET
# 离线训练不需要 SCENES_DIR（无仿真器），DATA_PATH 仅作 vocab 回退路径
# ============================================================================
DATASET:
  SPLIT: train
  DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260317/episodes/train/all_episodes.json
  vocab_file: output/seq2seq_offline/artifacts/vocab/train_vocab_260317.json

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
IL:
  lr: 1e-4
  batch_size: 1
  epochs: 10
  load_from_ckpt: false
  ckpt_to_load: output/cma/checkpoints/latest/best.pth

  OFFLINE:
    annotations_path: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260317/trajectory_data/annotations.json
    images_root: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260317/trajectory_data/images
    num_workers: 4
    pin_memory: true
    max_traj_len: 500
    max_instruction_len: 200
    rgb_size: 224
  
  RECOLLECT_TRAINER:
    # offline_trainer 仍复用这部分 scheduled sampling / max_traj_len 语义
    max_traj_len: 500
    use_scheduled_sampling: false
    scheduled_sampling_ratio: 0.0
    scheduled_sampling_p: 0.5
  
  use_inflection_weighting: true
  inflection_weight_coef: 2.0

  use_class_weighting: true
  class_weights:
    STOP: 0.3
    MOVE_FORWARD: 1.0
    TURN_LEFT: 1.5
    TURN_RIGHT: 1.5

# ============================================================================
# DDP（单卡时忽略）
# train_ddp.sh 会自动注入 DISTRIBUTED.enabled true
# ============================================================================
DISTRIBUTED:
  enabled: false
  backend: nccl

# ============================================================================
# EVALUATION CONFIGURATION
# ============================================================================
EVAL:
  SPLIT: val_seen
  EPISODE_COUNT: -1
  SAVE_RESULTS: true
  CKPT_PATH: output/cma/checkpoints/latest/best.pth

# ============================================================================
# INFERENCE CONFIGURATION
# ============================================================================
INFERENCE:
  SPLIT: test
  CKPT_PATH: output/cma/checkpoints/latest/best.pth
  PREDICTIONS_FILE: output/cma/predictions/cma_test.json

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
MODEL:
  policy_name: cma
  
  # CMA-specific instruction encoder settings (override defaults)
  INSTRUCTION_ENCODER:
    use_pretrained_embeddings: true
    embedding_file: output/seq2seq_offline/artifacts/embeddings/embeddings_glove50d_260317.json.gz
    fine_tune_embeddings: false
    embedding_size: 50
    vocab_size: 5395
    bidirectional: true
    final_state_only: false
  
  # CMA specific settings
  CMA:
    hidden_size: 512
    rnn_type: GRU
    use_prev_action: true

SWANLAB:
  project: SatNav
  experiment_name: cma-baseline
  logdir: output/cma/swanlab
  mode: disabled
  use_wxwork_notification: false
  webhook_url: null
  secret: null
