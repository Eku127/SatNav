# CMA (Cross-Modal Attention) Baseline - Unified Configuration
#
# This configuration implements the CMA model from "Improving Vision-and-Language
# Navigation with Image-Text Pairs from the Web" (Zhu et al., 2020).
# https://arxiv.org/abs/2004.02857
#
# Key differences from VLN-CE CMA:
#   - NO depth encoder (SatNav uses satellite imagery without depth)
#   - NO progress monitor (simplified implementation)
#   - Core CMA mechanism (RGB-instruction cross-modal attention) preserved
#
# Usage:
#   Training:   python run.py --exp-config configs/baselines/cma.yaml --run-type train
#   Evaluation: python run.py --exp-config configs/baselines/cma.yaml --run-type eval
#   Override:   python run.py --exp-config CONFIG --run-type eval EVAL.SPLIT val_unseen

# ============================================================================
# BASE CONFIGURATION
# ============================================================================

# Inherit from default.yaml (provides default values for all settings)
_base_: configs/default.yaml

# Path to task configuration (auto-loaded and merged)
BASE_TASK_CONFIG_PATH: configs/debug_vln_task.yaml

# Trainer to use (from registry)
TRAINER_NAME: recollect_trainer

# Directories
CHECKPOINT_FOLDER: output/checkpoints/cma
RESULTS_DIR: output/results/cma

# Device configuration
TORCH_GPU_ID: 0
NUM_PROCESSES: 1

# Video configuration (optional)
GENERATE_VIDEOS: true
VIDEO_DIR: output/videos/cma

# ============================================================================
# TRAINING CONFIGURATION (IL - Imitation Learning)
# ============================================================================
IL:
  # Optimizer settings
  # Reduced learning rate for better convergence on small dataset
  # Note: VLN-CE uses 2.5e-4 for large R2R dataset, but smaller lr works better for debug data
  lr: 1e-4
  # Smaller batch size for more frequent gradient updates
  batch_size: 1
  # Increased epochs to allow model to overfit training data
  epochs: 30
  
  # Checkpoint loading
  load_from_ckpt: false
  ckpt_to_load: output/checkpoints/cma/best.pth
  
  # RecollectTrainer specific settings
  RECOLLECT_TRAINER:
    preload_size: 5
    max_traj_len: 500
    
    # Scheduled sampling (optional for CMA)
    use_scheduled_sampling: false
    scheduled_sampling_ratio: 0.0
    scheduled_sampling_p: 0.5
  
  # Loss weighting configuration
  # Inflection weighting: Give higher weight to timesteps where action changes
  use_inflection_weighting: true
  inflection_weight_coef: 3.2
  
  # Class weighting: Balance loss across different action classes
  # Critical for handling imbalanced data (MOVE_FORWARD dominates ~90%)
  # WARNING: Extreme weights (e.g., MOVE_FORWARD=0.1, TURN=10.0) cause "spinning" behavior
  # Use moderate weights based on sqrt of inverse frequency
  use_class_weighting: true
  class_weights:
    STOP: 1.5           # Slightly increase (rare action)
    MOVE_FORWARD: 1.0   # Baseline (most common)
    TURN_LEFT: 3.0      # Moderate increase (very rare, ~1.5%)
    TURN_RIGHT: 1.5     # Slight increase (less common, ~9%)

# ============================================================================
# EVALUATION CONFIGURATION
# ============================================================================
EVAL:
  SPLIT: val_seen
  EPISODE_COUNT: -1
  SAVE_RESULTS: true
  CKPT_PATH: output/checkpoints/cma/best.pth

# ============================================================================
# INFERENCE CONFIGURATION
# ============================================================================
INFERENCE:
  SPLIT: test
  CKPT_PATH: output/checkpoints/cma/best.pth
  PREDICTIONS_FILE: output/predictions/cma_test.json

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
MODEL:
  # Model identification
  policy_name: cma  # Must match registry name
  
  # Visual input normalization
  normalize_rgb: false
  
  # Ablation flags
  ablate_instruction: false
  ablate_rgb: false
  
  # --------------------------------------------------------------------------
  # Instruction Encoder
  # --------------------------------------------------------------------------
  INSTRUCTION_ENCODER:
    sensor_uuid: instruction
    vocab_size: null  # Will be determined from dataset
    
    # GloVe embedding settings
    use_pretrained_embeddings: true
    embedding_file: data/debug_data/embeddings.json.gz
    fine_tune_embeddings: false
    embedding_size: 50  # GloVe 6B.50d
    
    # RNN encoder settings
    # CMA uses bidirectional LSTM for instruction encoding
    hidden_size: 128
    rnn_type: LSTM
    bidirectional: true  # Important: CMA uses bidirectional
    num_layers: 1
    final_state_only: false  # Important: CMA needs all timesteps for attention
  
  # --------------------------------------------------------------------------
  # RGB Visual Encoder (Satellite Imagery)
  # --------------------------------------------------------------------------
  RGB_ENCODER:
    cnn_type: TorchVisionResNet50
    output_size: 256
    trainable: false  # Freeze pretrained ResNet
    normalize_visual_inputs: false
    # Note: spatial_output=True is set in code for CMA (required for attention)
  
  # --------------------------------------------------------------------------
  # RNN State Encoder
  # --------------------------------------------------------------------------
  STATE_ENCODER:
    hidden_size: 512
    rnn_type: GRU  # CMA uses GRU for state encoding
    num_layers: 1

# ============================================================================
# WEIGHTS & BIASES LOGGING
# ============================================================================
WANDB:
  project: satnav-vln
  run_name: cma-baseline
  entity: null
  mode: online

