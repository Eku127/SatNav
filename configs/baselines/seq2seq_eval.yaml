# Seq2Seq online evaluation config.
# Defaults evaluate the checkpoint produced by seq2seq_offline_train.yaml on
# the repository-local example episodes.

_base_: configs/default.yaml

BASE_TASK_CONFIG_PATH: applications/resources/satnav_example_task.yaml

TRAINER_NAME: offline_trainer

CHECKPOINT_FOLDER: output/quickstart_baselines/seq2seq/checkpoints/latest
RESULTS_DIR: output/quickstart_baselines/seq2seq/results/latest
VIDEO_DIR: output/quickstart_baselines/seq2seq/videos/latest
GENERATE_VIDEOS: false

DATASET:
  SPLIT: test
  DATA_PATH: applications/resources/satnav_example_episodes.json
  SCENES_DIR: applications/resources/
  vocab_file: output/quickstart_baselines/artifacts/vocab/satnav_example_vocab.json

EVAL:
  SPLIT: test
  EPISODE_COUNT: -1
  SAVE_RESULTS: true
  CKPT_PATH: output/quickstart_baselines/seq2seq/checkpoints/latest/best.pth

IL:
  lr: 3e-4
  batch_size: 8
  load_from_ckpt: false
  ckpt_to_load: output/quickstart_baselines/seq2seq/checkpoints/latest/best.pth
  OFFLINE:
    annotations_path: output/quickstart_baselines/trajectory_data/annotations.json
    images_root: output/quickstart_baselines/trajectory_data/images
    num_workers: 0
    pin_memory: false
    max_traj_len: 500
    max_instruction_len: 200
    rgb_size: 224

MODEL:
  policy_name: seq2seq

  RGB_ENCODER:
    cnn_type: TorchVisionResNet50
    output_size: 256
    trainable: false
    pretrained: true

  INSTRUCTION_ENCODER:
    use_pretrained_embeddings: true
    embedding_file: output/quickstart_baselines/artifacts/embeddings/satnav_example_glove50d.json.gz
    fine_tune_embeddings: false
    embedding_size: 50
    hidden_size: 128
    rnn_type: LSTM
    bidirectional: false
    final_state_only: true
    vocab_size: 15

  SEQ2SEQ:
    hidden_size: 512
    rnn_type: GRU
    use_prev_action: true

SWANLAB:
  mode: disabled
