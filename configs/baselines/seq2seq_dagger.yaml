# Seq2Seq DAgger Trainer — online aggregation + supervised imitation

_base_: configs/default.yaml

BASE_TASK_CONFIG_PATH: configs/satnav_task.yaml

TRAINER_NAME: dagger_trainer

CHECKPOINT_FOLDER: output/seq2seq_dagger/checkpoints/latest
RESULTS_DIR: output/seq2seq_dagger/results/latest
VIDEO_DIR: output/seq2seq_dagger/videos/latest
GENERATE_VIDEOS: false

DATASET:
  SPLIT: train
  DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260317/episodes/train/all_episodes.json
  vocab_file: output/seq2seq_offline/artifacts/vocab/train_vocab_260317.json

IL:
  lr: 1e-4
  batch_size: 8
  epochs: 1
  load_from_ckpt: true
  ckpt_to_load: output/seq2seq_offline/checkpoints/latest/best.pth

  use_inflection_weighting: true
  inflection_weight_coef: 3.2

  use_class_weighting: false

  DAGGER:
    iterations: 5
    update_size: 200  # Global target across all ranks, not per-rank.
    beta_mode: exponential
    beta_start: 1.0
    beta_decay: 0.5
    min_beta: 0.0
    storage_dir: output/seq2seq_dagger/datasets/{split}
    reset_dataset_on_start: false
    preload_size: 100
    num_workers: 0
    pin_memory: true
    max_traj_len: 500
    max_instruction_len: 200
    rgb_size: 224
    deterministic_policy: false

DISTRIBUTED:
  enabled: false
  backend: nccl

EVAL:
  SPLIT: val_seen
  EPISODE_COUNT: -1
  SAVE_RESULTS: true
  CKPT_PATH: output/seq2seq_dagger/checkpoints/latest/best.pth

INFERENCE:
  SPLIT: test
  CKPT_PATH: output/seq2seq_dagger/checkpoints/latest/best.pth
  PREDICTIONS_FILE: output/seq2seq_dagger/predictions/seq2seq_dagger_test.json

MODEL:
  policy_name: seq2seq

  INSTRUCTION_ENCODER:
    use_pretrained_embeddings: true
    embedding_file: output/seq2seq_offline/artifacts/embeddings/embeddings_glove50d_260317.json.gz
    fine_tune_embeddings: false
    embedding_size: 50
    vocab_size: 5395

  SEQ2SEQ:
    hidden_size: 512
    rnn_type: GRU
    use_prev_action: true

SWANLAB:
  project: SatNav
  experiment_name: seq2seq-dagger-260317
  logdir: output/seq2seq_dagger/swanlab
  mode: disabled
  use_wxwork_notification: false
  webhook_url: null
  secret: null
