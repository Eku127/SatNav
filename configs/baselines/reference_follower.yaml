# Reference-path follower evaluation config.  Public defaults use the bundled
# example; scripts/classic/eval.sh overrides only local canonical data paths.

_base_: configs/default.yaml

BASE_TASK_CONFIG_PATH: configs/satnav_eval_task.yaml
TRAINER_NAME: recollect_trainer
RESULTS_DIR: output/baselines/classic/reference_follower/example
GENERATE_VIDEOS: false

MODEL:
  policy_name: reference_follower

EVAL:
  SPLIT: test
  EPISODE_COUNT: -1
  SAVE_RESULTS: true
  CKPT_PATH: null
