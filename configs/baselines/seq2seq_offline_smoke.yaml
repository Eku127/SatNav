_base_: configs/default.yaml

BASE_TASK_CONFIG_PATH: configs/satnav_task.yaml

TRAINER_NAME: offline_trainer

CHECKPOINT_FOLDER: output/seq2seq_offline/checkpoints/seq2seq_offline_smoke_260317
RESULTS_DIR: output/seq2seq_offline/results/seq2seq_offline_smoke_260317
VIDEO_DIR: output/seq2seq_offline/videos/seq2seq_offline_smoke_260317
GENERATE_VIDEOS: false

DATASET:
  SPLIT: train
  DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260317/episodes/train/all_episodes.json
  vocab_file: output/seq2seq_offline/artifacts/vocab/train_vocab_260317.json

IL:
  lr: 1e-4
  batch_size: 1
  epochs: 1
  load_from_ckpt: false
  ckpt_to_load: output/seq2seq_offline/checkpoints/seq2seq_offline_smoke_260317/best.pth

  OFFLINE:
    annotations_path: output/seq2seq_offline/artifacts/smoke/offline_annotations_128_260317.json
    images_root: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260317/trajectory_data/images
    num_workers: 0
    pin_memory: true
    rgb_size: 224
    max_instruction_len: 200
    max_traj_len: 500

  use_inflection_weighting: true
  inflection_weight_coef: 3.2
  use_class_weighting: true
  class_weights:
    STOP: 1.0
    MOVE_FORWARD: 0.1
    TURN_LEFT: 10.0
    TURN_RIGHT: 10.0

MODEL:
  policy_name: seq2seq
  INSTRUCTION_ENCODER:
    use_pretrained_embeddings: false
    embedding_file: output/seq2seq_offline/artifacts/embeddings/embeddings_glove50d_260317.json.gz
    fine_tune_embeddings: false
    embedding_size: 50
    vocab_size: 5395
  SEQ2SEQ:
    hidden_size: 512
    rnn_type: GRU
    use_prev_action: true

SWANLAB:
  project: SatNav
  experiment_name: seq2seq-offline-smoke-260317
  logdir: output/seq2seq_offline/swanlab
  mode: disabled
  use_wxwork_notification: false
  webhook_url: null
  secret: null
