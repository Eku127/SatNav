# SatNav VLN Task Configuration
# This configuration file defines the settings for Vision-and-Language Navigation
# tasks in continuous space using satellite maps.

ENVIRONMENT:
  # Maximum number of steps allowed per episode
  MAX_EPISODE_STEPS: 500

SIMULATOR:
  # Simulator type: "satsim" (2D satellite imagery) or "aerialsim" (3D aerial view)
  TYPE: satsim
  
  # Forward movement step size in meters
  FORWARD_STEP_SIZE: 10
  
  # Turn angle in degrees (for TURN_LEFT and TURN_RIGHT actions)
  TURN_ANGLE: 15
  
  # RGB sensor configuration
  RGB_SENSOR:
    # Image width in pixels
    WIDTH: 448
    # Image height in pixels
    HEIGHT: 448
    # Horizontal field of view in degrees
    HFOV: 90
  
  # AerialSim-specific configuration (used when TYPE: aerialsim)
  # Requires Google 3D Tiles API key
  AERIAL:
    # Google 3D Tiles API key (required for aerialsim)
    API_KEY: "YOUR_GOOGLE_API_KEY"
    # Browser to use for rendering: chrome, edge, firefox
    BROWSER: chrome
    # Run in headless mode (default: true for server environments)
    HEADLESS: true
    # Fail fast when the API key, quota, or network cannot reach Google 3D Tiles
    ENABLE_API_PREFLIGHT: true
    API_PREFLIGHT_TIMEOUT_SEC: 10.0
    # Rendering must reach a stable tileset state before screenshots are accepted
    STARTUP_READY_TIMEOUT_SEC: 20.0
    TILESET_READY_TIMEOUT_SEC: 30.0
    GROUND_QUERY_TIMEOUT_SEC: 12.0
    GROUND_QUERY_GRID_SCALE: 3.0
    GROUND_QUERY_FOOTPRINT_SCALE: 1.5
    GROUND_QUERY_SAMPLES: 5
    GROUND_QUERY_SAFETY_MARGIN_METERS: 5.0
    HEIGHT_RANGE_CLEARANCE_SCALE: 1.0
    RENDER_STABLE_TIMEOUT_SEC: 8.0
    STABLE_POLLS_REQUIRED: 3
    STATUS_POLL_INTERVAL_SEC: 0.5
    # Retry invalid frames and rebuild the browser session after repeated failures
    CAPTURE_ATTEMPTS: 4
    RETRY_SLEEP_SEC: 1.0
    RESTART_AFTER_FAILURES: 2
    MAX_BROWSER_RESTARTS: 2
    STRICT_VALIDATION: true
    # Require enough loaded tiles before accepting a frame
    MIN_TILES_LOADED: 8
    GROUND_QUERY_MIN_TILES_LOADED: 1
    # Allow capture when the image is already visually ready but a few tile
    # requests are still streaming; the image-quality gate still applies.
    ALLOW_SALVAGE_CAPTURE: false
    SALVAGE_MAX_PENDING_REQUESTS: 24
    SALVAGE_MAX_TILES_PROCESSING: 4
    # Reject obviously broken renders (black/blue blanks, incomplete tiles)
    QUALITY_MIN_MEAN: 15.0
    QUALITY_MIN_STD: 20.0
    QUALITY_MAX_BLACK_FRAC: 0.60
    QUALITY_MAX_DARK_FRAC: 0.85
    QUALITY_MIN_UNIQUE_COLORS: 2000

TASK:
  # Task type identifier
  TYPE: VLN
  
  # Success distance threshold in meters
  # Agent is considered successful if it stops within this distance from the goal
  # DEFAULT is used for examples and path generation
  # Type-specific values (Boundary, LandmarkSet, Road) are used during evaluation
  SUCCESS_DISTANCE:
    DEFAULT: 10.0
    Boundary: 10.0
    LandmarkSet: 3.0
    Road: 10.0
  
  # Sensors that provide observations to the agent
  # Built-in sensors (always enabled):
  #   - RGB: Satellite BEV image
  #   - INSTRUCTION: Natural language instruction text
  #   - AGENT_POSE: Ego-frame relative pose from episode start
  #     Output: [delta_forward_m, delta_right_m, sin(delta_heading), cos(delta_heading)]
  #     Coordinate system: forward = initial heading direction, right = 90° clockwise
  
  # Available actions for the agent
  POSSIBLE_ACTIONS: [STOP, MOVE_FORWARD, TURN_LEFT, TURN_RIGHT]
  
  # Enabled evaluation measures
  # Available measures:
  #   - DISTANCE_TO_GOAL: Geodesic distance to the goal
  #   - SUCCESS: Whether the agent successfully reached the goal
  #   - PATH_LENGTH: Total path length traveled (using geodesic distance)
  #   - SPL: Success weighted by Path Length
  #   - TOP_DOWN_MAP: Top-down map visualization (for video/debugging)
  #                   NOTE: TOP_DOWN_MAP requires SCENES_DIR with satellite TIF files
  MEASUREMENTS: [DISTANCE_TO_GOAL, SUCCESS, SPL, PATH_LENGTH, TOP_DOWN_MAP]
  
  # Top-Down Map visualization configuration
  # Enable by adding TOP_DOWN_MAP to MEASUREMENTS list
  TOP_DOWN_MAP:
    # Maximum resolution of the map image (longest side in pixels)
    MAP_RESOLUTION: 1024
    # Padding around the reference path in meters
    PADDING_METERS: 50.0
    # Whether to draw the reference path (green line)
    DRAW_REFERENCE_PATH: True
    # Whether to draw start (blue) and goal (red) markers
    DRAW_SOURCE_AND_TARGET: True

DATASET:
  # Dataset type identifier (informational only, not used in current implementation)
  # Since we don't use a registry system, this field is informational only.
  TYPE: SatNav
  
  # Dataset split: train, val_seen, val_unseen, test
  SPLIT: test
  
  # Path to the dataset JSON file
  # Supports both .json and .json.gz formats
  # Use {split} placeholder to be replaced with the SPLIT value
  # For example testing, use: tests/test_data/satnav_dataset_complex.json
  # DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260202/episodes/train/all_episodes.json
  # DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260126/episodes/B_VLN_Episodes.json
  # DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260123/episodes/episodes_landmarkSet.json
  # DATA_PATH: /mnt/data1/home/jiangjiajun/workspace/SatNav/tests/test_data/satnav_success_distance_test.json
  # DATA_PATH: /mnt/data3/jiangjiajun/dataset/satnav_datasets/ver_260211/episodes/train/all_episodes.json
  DATA_PATH: /mnt/data1/home/jiangjiajun/workspace/SatNav/output/VLN_episodes(1).json
  
  # Directory containing scene datasets (satellite maps)
  # For example testing, use: tests/test_data/
  SCENES_DIR: /mnt/data3/jiangjiajun/dataset/satnav_datasets/scenes/
