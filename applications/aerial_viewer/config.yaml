# Aerial Viewer Configuration
# Non-interactive 3D aerial view renderer using CesiumJS and Google 3D Tiles
# SatSim-compatible mode only

# Google 3D Tiles API Configuration
API:
  API_KEY: "YOUR_GOOGLE_API_KEY"  # Google 3D Tiles API key

# Agent State Configuration (SatSim-compatible)
AGENT:
  LONGITUDE: -121.99935840639316   # Longitude (degrees)
  LATITUDE: 37.510891320638834     # Latitude (degrees)
  ALTITUDE: 50       # Altitude (meters)
  ROTATION: 160.0         # Rotation/roll angle (degrees, 0=North)

# Camera Settings
CAMERA:
  HFOV: 90             # Horizontal field of view (degrees)
  WIDTH: 448           # Output width (pixels)
  HEIGHT: 448          # Output height (pixels)

# Browser Configuration
BROWSER:
  DRIVER: "chrome"    # Browser driver: "edge", "chrome", "firefox"
  HEADLESS: false    # WebGL requires non-headless mode for CesiumJS 3D rendering

# Rendering Configuration
RENDERING:
  MAX_WAIT_TIME: 60.0   # Maximum wait time for 3D Tiles to load (seconds)
  CHECK_INTERVAL: 0.5   # Interval between status checks (seconds)
  STABILITY_CHECKS: 5   # Number of consecutive stable checks before proceeding
  OUTPUT_PATH: "output/aerial_view_30.png"  # Output image path
