model:
  version: imgsp_v1
  model-max-length: 1536
  mm-projector-type: mlp2x_gelu
  mm-vision-select-layer: -2
  mm-vision-select-feature: patch
  compress-type: "grid:2"
  video-fps: 1

data:
  window-size: 4
  augmentation: true

training:
  train-components: all
  seed: 10
  num-train-epochs: 1
  per-device-batch-size: 1
  gradient-accumulation-steps: 1
  learning-rate: 1.0e-5
  weight-decay: 0.0
  warmup-ratio: 0.03
  lr-scheduler-type: cosine
  save-strategy: steps
  save-steps: 1000
  save-total-limit: 1
  logging-steps: 1
  tf32: true
  gradient-checkpointing: true
  dataloader-num-workers: 2
