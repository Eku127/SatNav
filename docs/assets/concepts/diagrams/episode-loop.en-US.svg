<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">One episode, one feedback loop</title>
  <desc id="desc">Each act returns one primitive action; an adapter may maintain an action queue</desc>
  <defs>
    <marker id="2475A5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2475A5" />
    </marker>
    <marker id="29836A" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#29836A" />
    </marker>
    <marker id="B87623" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#B87623" />
    </marker>
    <marker id="7958A5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7958A5" />
    </marker>
    <marker id="52677C" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#52677C" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="660" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" />
  <text x="36" y="48.99" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">
    <tspan x="36" dy="0">One episode, one feedback loop</tspan>
  </text>
  <text x="36" y="89.58" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">
    <tspan x="36" dy="0">Each act returns one primitive action; an adapter may maintain an action queue</tspan>
  </text>
  <rect x="40" y="130" width="295" height="110" rx="12" fill="#EDF6FC" stroke="#2475A5" stroke-width="2" />
  <text x="187.5" y="162.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="187.5" dy="0">Initialize episode</tspan>
  </text>
  <text x="187.5" y="197.16" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    <tspan x="187.5" dy="0">Env.reset_to_episode()</tspan>
    <tspan x="187.5" dy="24.839999999999996">PolicyAdapter.reset()</tspan>
  </text>
  <rect x="410" y="130" width="280" height="110" rx="12" fill="#EDF6FC" stroke="#2475A5" stroke-width="2" />
  <text x="550.0" y="162.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="550.0" dy="0">Current observation</tspan>
  </text>
  <text x="550.0" y="209.58" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    <tspan x="550.0" dy="0">RGB · instruction · agent_pose</tspan>
  </text>
  <rect x="770" y="130" width="285" height="110" rx="12" fill="#F5F0FA" stroke="#7958A5" stroke-width="2" />
  <text x="912.5" y="162.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="912.5" dy="0">PolicyAdapter.act()</tspan>
  </text>
  <text x="912.5" y="209.58" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    <tspan x="912.5" dy="0">Query model or pop action</tspan>
  </text>
  <polyline points="335,185 410,185" fill="none" stroke="#2475A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2475A5)" />
  <polyline points="690,185 770,185" fill="none" stroke="#2475A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2475A5)" />
  <rect x="770" y="310" width="285" height="110" rx="12" fill="#EDF6FC" stroke="#2475A5" stroke-width="2" />
  <text x="912.5" y="342.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="912.5" dy="0">Env.step(action)</tspan>
  </text>
  <text x="912.5" y="377.16" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    <tspan x="912.5" dy="0">SatSim: update state and RGB</tspan>
    <tspan x="912.5" dy="24.839999999999996">Task: sensors and measures</tspan>
  </text>
  <polyline points="912,240 912,310" fill="none" stroke="#7958A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#7958A5)" />
  <rect x="410" y="310" width="280" height="110" rx="12" fill="#FFF6E8" stroke="#B87623" stroke-width="2" />
  <text x="550.0" y="342.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="550.0" dy="0">Check termination</tspan>
  </text>
  <text x="550.0" y="389.58" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    <tspan x="550.0" dy="0">STOP / max_steps</tspan>
  </text>
  <polyline points="770,365 690,365" fill="none" stroke="#2475A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2475A5)" />
  <polyline points="550,310 550,240" fill="none" stroke="#29836A" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#29836A)" />
  <text x="465.0" y="280.77" fill="#29836A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
    <tspan x="465.0" dy="0">Continue: new obs</tspan>
  </text>
  <rect x="410" y="505" width="280" height="100" rx="12" fill="#EDF8F3" stroke="#29836A" stroke-width="2" />
  <text x="550.0" y="537.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="550.0" dy="0">Write result</tspan>
  </text>
  <text x="550.0" y="579.58" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    <tspan x="550.0" dy="0">metrics + action trace</tspan>
  </text>
  <polyline points="550,420 550,505" fill="none" stroke="#B87623" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#B87623)" />
  <text x="565" y="469.08" fill="#B87623" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">
    <tspan x="565" dy="0">Finished</tspan>
  </text>
  <text x="182.5" y="387.17" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">
    <tspan x="182.5" dy="0">Env tracks steps and termination</tspan>
    <tspan x="182.5" dy="26.22">Evaluator persists results</tspan>
    <tspan x="182.5" dy="26.22">Next episode resets policy history</tspan>
  </text>
</svg>