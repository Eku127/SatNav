<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Arrival, stopping, and leave-and-return</title>
  <desc id="desc">r is the task success radius; S = Success, OS = Oracle Success</desc>
  <defs>
    <marker id="2475A5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2475A5" />
    </marker>
    <marker id="29836A" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#29836A" />
    </marker>
    <marker id="B87623" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#B87623" />
    </marker>
    <marker id="7958A5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7958A5" />
    </marker>
    <marker id="52677C" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#52677C" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="650" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" />
  <text x="36" y="48.99" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start">
    <tspan x="36" dy="0">Arrival, stopping, and leave-and-return</tspan>
  </text>
  <text x="36" y="89.58" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start">
    <tspan x="36" dy="0">r is the task success radius; S = Success, OS = Oracle Success</tspan>
  </text>
  <rect x="35" y="130" width="310" height="325" rx="12" fill="#F7FAFC" stroke="#DAE4EC" stroke-width="2" />
  <rect x="395" y="130" width="310" height="325" rx="12" fill="#F7FAFC" stroke="#DAE4EC" stroke-width="2" />
  <rect x="755" y="130" width="310" height="325" rx="12" fill="#F7FAFC" stroke="#DAE4EC" stroke-width="2" />
  <text x="190.0" y="182.13" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <tspan x="190.0" dy="0">Arrive and stop</tspan>
  </text>
  <text x="550.0" y="181.51" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <tspan x="550.0" dy="0">Pass through, stop outside</tspan>
  </text>
  <text x="910.0" y="182.13" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <tspan x="910.0" dy="0">Leave and return</tspan>
  </text>
  <ellipse cx="190.0" cy="293.0" rx="48.0" ry="48.0" fill="#EDF8F3" stroke="#29836A" stroke-width="2" />
  <ellipse cx="190.0" cy="293.0" rx="5.0" ry="5.0" fill="#29836A" stroke="#29836A" stroke-width="2" />
  <text x="190.0" y="365.27" fill="#29836A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
    <tspan x="190.0" dy="0">goal / r</tspan>
  </text>
  <ellipse cx="550.0" cy="293.0" rx="48.0" ry="48.0" fill="#EDF8F3" stroke="#29836A" stroke-width="2" />
  <ellipse cx="550.0" cy="293.0" rx="5.0" ry="5.0" fill="#29836A" stroke="#29836A" stroke-width="2" />
  <text x="550.0" y="365.27" fill="#29836A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
    <tspan x="550.0" dy="0">goal / r</tspan>
  </text>
  <ellipse cx="910.0" cy="293.0" rx="48.0" ry="48.0" fill="#EDF8F3" stroke="#29836A" stroke-width="2" />
  <ellipse cx="910.0" cy="293.0" rx="5.0" ry="5.0" fill="#29836A" stroke="#29836A" stroke-width="2" />
  <text x="910.0" y="365.27" fill="#29836A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
    <tspan x="910.0" dy="0">goal / r</tspan>
  </text>
  <polyline points="75,390 135,310 185,298" fill="none" stroke="#2475A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2475A5)" />
  <text x="190.0" y="426.82" fill="#29836A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="190.0" dy="0">S = 1   OS = 1</tspan>
  </text>
  <polyline points="425,355 550,295 660,240" fill="none" stroke="#2475A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2475A5)" />
  <text x="550.0" y="426.82" fill="#B87623" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="550.0" dy="0">S = 0   OS = 1</tspan>
  </text>
  <polyline points="910,295 805,230 1010,220 1010,380 920,305" fill="none" stroke="#2475A5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#2475A5)" />
  <text x="910.0" y="426.82" fill="#29836A" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="910.0" dy="0">S = 1   OS = 1</tspan>
  </text>
  <text x="910.0" y="486.54" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
    <tspan x="910.0" dy="0">First: distance from start &gt; 2r</tspan>
    <tspan x="910.0" dy="23.459999999999997">Then: distance to goal &lt; r + STOP</tspan>
  </text>
  <text x="370.0" y="499.2" fill="#52677C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">
    <tspan x="370.0" dy="0">Ordinary case: STOP inside the goal region gives Success</tspan>
  </text>
  <rect x="35" y="550" width="1030" height="70" rx="12" fill="#FFF6E8" stroke="#B87623" stroke-width="2" />
  <text x="550.0" y="582.82" fill="#20364C" font-family="Arial, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <tspan x="550.0" dy="0">Leave-and-return applies when the start-to-first-goal distance is &lt; r</tspan>
  </text>
</svg>